<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c98a63" />
      <stop offset="1" stop-color="#a35a3a" />
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf4" />
      <stop offset="1" stop-color="#f7e8dc" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#bg)" />
  <!-- Lotus bloom: side petals behind, center petal in front -->
  <g>
    <path
      d="M16 25.5 C 11.5 19.5, 12 13.5, 16 9 C 20 13.5, 20.5 19.5, 16 25.5 Z"
      fill="url(#petal)"
      opacity="0.55"
      transform="rotate(-42 16 25.5)"
    />
    <path
      d="M16 25.5 C 11.5 19.5, 12 13.5, 16 9 C 20 13.5, 20.5 19.5, 16 25.5 Z"
      fill="url(#petal)"
      opacity="0.55"
      transform="rotate(42 16 25.5)"
    />
    <path
      d="M16 25.5 C 11.5 19.5, 12 13.5, 16 9 C 20 13.5, 20.5 19.5, 16 25.5 Z"
      fill="url(#petal)"
    />
  </g>
  <!-- Champagne sparkle -->
  <path
    d="M24.6 4.6 C 25 6.6, 25.9 7.5, 27.9 7.9 C 25.9 8.3, 25 9.2, 24.6 11.2 C 24.2 9.2, 23.3 8.3, 21.3 7.9 C 23.3 7.5, 24.2 6.6, 24.6 4.6 Z"
